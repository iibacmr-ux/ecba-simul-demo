<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosine — Premier Jour | IIBA Cameroun</title>
<style>
:root{--navy:#062f3e;--navy2:#0a5266;--orange:#f05a00;--ink:#17343e;--muted:#60747b;--line:#dce7ea;--bg:#eef4f5;--white:#fff;--good:#12805c}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow:hidden}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:14px}.iiba{font-weight:950;font-size:28px;color:#071f48;letter-spacing:-1px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--orange);vertical-align:top;margin-right:-3px}.vline{width:1px;height:38px;background:#ccdadd}.chapter{font-weight:800;color:var(--navy)}.chapter small{display:block;color:var(--orange);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
header button{border:0;background:#eef3f4;color:var(--navy);font-weight:800;padding:11px 14px;border-radius:11px;cursor:pointer}
main{height:calc(100vh - 118px);position:relative;overflow:hidden;background:radial-gradient(circle at 82% 15%,#fff0e6,transparent 28%),linear-gradient(135deg,#fff 0,#f7fafb 46%,#e8f1f3 100%)}
footer{height:42px;background:var(--navy);color:#d8e9ed;display:flex;align-items:center;gap:14px;padding:0 20px;font-size:12px}
#track{height:5px;flex:1;max-width:480px;background:#ffffff2c;border-radius:99px;overflow:hidden}#track i{display:block;height:100%;width:0;background:var(--orange);transition:.25s}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.hero{width:min(1120px,94vw);height:min(640px,80vh);display:grid;grid-template-columns:1.08fr .92fr;background:#fff;border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #062f3e20}
.hero-copy{padding:58px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;color:var(--orange);letter-spacing:.17em;font-weight:900;text-transform:uppercase}
h1{font-size:70px;line-height:.95;margin:12px 0;color:var(--navy);letter-spacing:-2px}h1 span{display:block;color:var(--orange);font-size:.52em;letter-spacing:-1px;margin-top:12px}
.lead{font-size:20px;line-height:1.55;color:#526a73}
.btn{border:0;border-radius:13px;padding:14px 20px;font:inherit;font-weight:850;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#edf3f4;color:var(--navy)}
.art{background:linear-gradient(145deg,var(--navy),var(--navy2));display:flex;align-items:center;justify-content:center;position:relative}
.portrait{width:290px;height:390px;border-radius:150px 150px 28px 28px;background:linear-gradient(160deg,#fff4eb,#edd5c4);position:relative;box-shadow:0 30px 60px #0003;display:flex;align-items:center;justify-content:center}
.portrait:before{content:"R";width:154px;height:154px;border-radius:50%;background:#1f3340;color:#fff;display:grid;place-items:center;font-size:82px;font-weight:900;border:9px solid #fff}
.portrait:after{content:"BUSINESS ANALYST";position:absolute;bottom:34px;color:var(--navy);font-weight:900;letter-spacing:.12em;font-size:11px}
.loc{position:absolute;top:25px;left:28px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-weight:850;color:var(--navy)}
.person{height:62vh;width:min(370px,38vw);border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:0 22px 60px #062f3e20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.avatar{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:950;font-size:82px;box-shadow:0 16px 35px #062f3e30;border:8px solid #fff}.avatar.r{background:linear-gradient(145deg,#f5b77e,#a93f18)}.avatar.v{background:linear-gradient(145deg,#4b5358,#14191c)}.avatar.k{background:linear-gradient(145deg,#456577,#162d38)}
.person h2{margin:0;color:var(--navy)}.person small{color:var(--orange);font-weight:850;letter-spacing:.1em}
.dialogue{position:absolute;left:28px;right:28px;bottom:24px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 22px;box-shadow:0 16px 45px #062f3e22;cursor:pointer}
.speaker{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:6px 10px;font-weight:850;margin-bottom:8px}.speaker.v{background:#aa4308}.speaker.k{background:#0d5368}.text{font-size:25px;line-height:1.42}
.insight{position:absolute;right:32px;top:92px;width:365px;background:#fff;border-left:5px solid var(--orange);border-radius:16px;padding:18px;box-shadow:0 14px 35px #062f3e1c}.insight b{font-size:10px;letter-spacing:.14em;color:var(--orange)}.insight h3{margin:5px 0;color:var(--navy)}
.grid{width:min(1080px,94vw);display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;min-height:130px;box-shadow:0 10px 26px #062f3e12}.card h3{margin:0 0 8px;color:var(--navy);font-size:21px}.card p{margin:0;color:var(--muted);line-height:1.45}.card .num{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:50%;background:var(--orange);color:#fff;font-weight:950;margin-bottom:12px}
.discovery{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer}
.choice{width:min(1000px,94vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 20px 60px #062f3e24}.choice h2{font-size:39px;color:var(--navy);margin:8px 0 22px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{border:1px solid #dde7e9;background:#f6f9f9;color:#24434d;border-radius:14px;padding:17px;text-align:left;font-weight:760;cursor:pointer;line-height:1.35}.opt:hover{border-color:var(--orange);background:#fff8f3}.opt em{font-style:normal;color:var(--orange);font-weight:950;margin-right:8px}
.final{width:min(900px,94vw);background:#fff;border-radius:25px;padding:48px;text-align:center;box-shadow:0 20px 60px #062f3e24}.final h2{font-size:54px;color:var(--navy);margin:4px}.final h2 span{color:var(--orange)}.final p{font-size:18px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:#062f3edb;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}.modal{width:min(820px,95vw);max-height:84vh;overflow:auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0005}.modal h2{color:var(--navy)}.scene{display:block;width:100%;border:0;background:#eef4f5;color:var(--navy);padding:11px 13px;border-radius:10px;text-align:left;margin:7px 0;font-weight:760;cursor:pointer}
.pause{position:absolute;bottom:24px;right:28px;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:10px 12px;font-weight:800}
@media(max-width:820px){header{height:68px;padding:0 12px}.chapter{display:none}main{height:calc(100vh - 110px)}.hero{grid-template-columns:1fr;height:auto;max-height:85vh}.hero-copy{padding:28px}h1{font-size:46px}.art{min-height:240px}.portrait{height:220px;width:180px}.portrait:before{width:100px;height:100px;font-size:54px}.person{height:49vh;width:80vw}.avatar{width:125px;height:125px;font-size:62px}.text{font-size:20px}.insight{left:14px;right:14px;top:78px;width:auto}.opts,.grid{grid-template-columns:1fr}.grid{max-height:68vh;overflow:auto}.choice h2{font-size:28px}.final h2{font-size:40px}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="iiba"><span class="dot"></span>IIBA</div><div class="vline"></div><div><b>IIBA Cameroon Chapter</b><small>VISUAL NOVEL PÉDAGOGIQUE</small></div></div>
 <div class="chapter"><small>Épisode 0</small>Le dossier Commissionnement</div>
 <button onclick="facilitator()">Mode formateur</button>
</header>
<main id="main"></main>
<footer><div id="track"><i></i></div><span id="label">Accueil</span><span style="margin-left:auto">Espace : continuer · F : formateur</span></footer>
<script>
const scenes=[
{t:"intro",title:"Prologue — Premier jour",place:"DOUALA · IMHOTEP ASSURANCE",text:"Lundi, 08 h 12. Premier jour de Rosine chez Imhotep Assurance."},
{t:"dialogue",title:"Prologue — Premier jour",who:"r",name:"ROSINE — pensée",place:"Hall — Imhotep Assurance",text:"Premier jour. Premier projet. Et apparemment… pas le plus simple."},
{t:"dialogue",title:"Prologue — Premier jour",who:"k",name:"Kanu",place:"Message reçu",text:"Bienvenue Rosine. Dès que tu arrives, passe me voir. On a un problème avec les commissions."},
{t:"dialogue",title:"Prologue — Premier jour",who:"r",name:"ROSINE — pensée",place:"Hall — Imhotep Assurance",text:"D’accord… Commençons par comprendre avant de proposer quoi que ce soit.",ins:["Posture BA","Comprendre le besoin avant de figer une solution."]},
{t:"dialogue",title:"Acte 1 — Le monde de Valery",who:"v",name:"Valery",place:"Bureau de Valery",text:"Le calcul des commissions semble être un problème administratif. Mais pour moi, il est beaucoup plus important que ça."},
{t:"dialogue",title:"Acte 1 — Le monde de Valery",who:"r",name:"Rosine",place:"Bureau de Valery",text:"Pourquoi ?"},
{t:"dialogue",title:"Acte 1 — Le monde de Valery",who:"v",name:"Valery",place:"Bureau de Valery",text:"Parce qu’un courtier qui ne comprend pas sa commission ne voit pas un problème Excel. Il voit Imhotep qui ne sait pas combien elle lui doit."},
{t:"dialogue",title:"Acte 1 — Le monde de Valery",who:"r",name:"Rosine",place:"Bureau de Valery",text:"Donc l’enjeu n’est pas seulement de calculer plus vite."},
{t:"dialogue",title:"Acte 1 — Le monde de Valery",who:"v",name:"Valery",place:"Bureau de Valery",text:"Exactement. Il y a la fiabilité. Mais aussi la confiance.",ins:["Enjeu métier","Commissionnement → satisfaction, motivation et confiance des courtiers."]},
{t:"grid",title:"Acte 2 — Le processus actuel",cards:[["1","Convention courtier"],["2","Prospect convaincu"],["3","Mandat signé"],["4","Affaire transmise"],["5","Commission calculée sous Excel"],["→","Un processus métier critique"]]},
{t:"grid",title:"Acte 3 — Le chaos Excel",cards:[["1","Données dispersées"],["2","Calculs manuels"],["3","Versions multiples"],["4","Retards de traitement"],["5","Traçabilité limitée"],["6","Risque d’erreurs"]]},
{t:"choice",title:"Décision 1",q:"Vous êtes Rosine. Quelle serait votre prochaine action ?",opts:[
["A","Demander immédiatement quel outil remplacera Excel","Parler outil trop tôt verrouille la réflexion avant d’avoir compris le problème."],
["B","Comprendre davantage le processus actuel et les problèmes rencontrés","Bonne posture BA : comprendre l’état actuel et le besoin avant de figer la solution."],
["C","Demander à Kanu de lancer directement le développement","Développer quoi exactement ? Les besoins et impacts ne sont pas encore compris."],
["D","Commencer à rédiger les exigences de la future solution","Trop tôt : il manque encore des informations confirmées."]]},
{t:"dialogue",title:"Acte 4 — La version de Kanu",who:"k",name:"Kanu",place:"Salle projet",text:"Valery regarde naturellement les courtiers et le métier. Moi, je dois aussi penser aux systèmes, aux données, aux interfaces et à la maintenance."},
{t:"dialogue",title:"Acte 4 — La version de Kanu",who:"r",name:"Rosine",place:"Salle projet",text:"Donc la valeur attendue n’est pas exactement la même pour toutes les parties prenantes.",ins:["BACCM en action","Stakeholder + Value + Context : une transformation peut créer des valeurs différentes selon les acteurs."]},
{t:"grid",title:"Acte 5 — Le projet stratégique",cards:[["Automatiser","les calculs"],["Fiabiliser","les données"],["Tracer","les décisions"],["Piloter","avec des reportings"],["Renforcer","la confiance"],["⚠","Besoin ≠ Solution"]]},
{t:"dialogue",title:"Acte 5 — Le projet stratégique",who:"k",name:"Kanu",place:"Salle projet",text:"Une solution moderne de type Anaplan fait partie des pistes retenues."},
{t:"choice",title:"Décision 2",q:"Quelle formulation décrit le mieux le besoin métier ?",opts:[
["A","Remplacer Excel par Anaplan","C’est une solution possible, pas le besoin."],
["B","Installer un outil moderne de commissionnement","C’est encore une solution."],
["C","Fiabiliser, accélérer et tracer le calcul des commissions","Exact : cela décrit le résultat métier recherché."],
["D","Former les utilisateurs à Excel","C’est une action, pas le besoin métier."]]},
{t:"grid",title:"Acte 6 — Qui est qui ?",cards:[["Valery","Métier · Ventes & Marketing"],["Kanu","IT · Gestion des canaux"],["Finance","Paiements, contrôle, audit"],["RH","Rémunération et règles"],["Prestations","Produits, contrats, données"],["Direction","Sponsor · vision et priorités"]]},
{t:"grid",title:"Acte 7 — Le mandat de Rosine",cards:[["COMPRENDRE","besoins et processus"],["ALIGNER","parties prenantes"],["CLARIFIER","règles métier"],["STRUCTURER","exigences"],["TRACER","décisions et besoins"],["ACCOMPAGNER","transformation"]]},
{t:"dialogue",title:"Acte 8 — Vous entrez dans l’équipe",who:"r",name:"Rosine",place:"Salle projet",text:"J’ai compris les premières pièces du puzzle. Mais il reste beaucoup de questions… et je vais avoir besoin de vous."},
{t:"end",title:"Fin de l’épisode 0"}
];
let i=-1;
const main=document.getElementById("main"), bar=document.querySelector("#track i"), label=document.getElementById("label");
function progress(){bar.style.width=Math.max(0,(i+1)/scenes.length*100)+"%";label.textContent=i>=0?scenes[i].title:"Accueil"}
function next(){if(i<scenes.length-1){i++;render()}}
function person(who,name){const letter=who==="r"?"R":who==="v"?"V":"K";const role=who==="r"?"Business Analyst":who==="v"?"Ventes & Marketing":"Gestion des canaux (IT)";return `<div class="person"><div class="avatar ${who}">${letter}</div><h2>${name}</h2><small>${role}</small></div>`}
function insight(v){return v?`<aside class="insight"><b>INSIGHT BA DÉCOUVERT</b><h3>${v[0]}</h3><div>${v[1]}</div></aside>`:""}
function render(){
 progress(); const s=scenes[i]; let h="";
 if(s.t==="intro") h=`<section class="stage"><div class="final" onclick="next()"><div class="eyebrow">${s.place}</div><h2 style="font-size:42px">${s.text}</h2><p>Cliquez pour continuer</p></div></section>`;
 if(s.t==="dialogue") h=`<section class="stage" onclick="next()"><div class="loc">${s.place}</div>${person(s.who,s.name)}${insight(s.ins)}<div class="dialogue"><span class="speaker ${s.who}">${s.name}</span><div class="text">${s.text}</div></div></section>`;
 if(s.t==="grid") h=`<section class="stage"><div class="grid">${s.cards.map((c,n)=>`<div class="card"><div class="num">${c[0]}</div><h3>${c[0].length>2?c[0]:""}</h3><p>${c[1]}</p></div>`).join("")}</div><button class="discovery" onclick="next()">Continuer l’histoire</button></section>`;
 if(s.t==="choice") h=`<section class="stage"><div class="choice"><div class="eyebrow">DÉCISION COLLECTIVE</div><h2>${s.q}</h2><div class="opts">${s.opts.map(o=>`<button class="opt" onclick='feedback(${JSON.stringify(o[0])},${JSON.stringify(o[2])})'><em>${o[0]}.</em>${o[1]}</button>`).join("")}</div><button class="pause" onclick="event.stopPropagation();facilitator()">Pause formateur</button></div></section>`;
 if(s.t==="end") h=`<section class="stage"><div class="final"><div class="eyebrow">MISSION ACCEPTÉE</div><h2>À vous de <span>jouer.</span></h2><p>Situation → réflexion → BABOK → atelier → BA Quest.</p><p><button class="btn primary" onclick="window.open('https://iiba237.org/baquest-vn/','_blank')">Ouvrir BA Quest</button> <button class="btn secondary" onclick="i=-1;home()">Rejouer</button></p></div></section>`;
 main.innerHTML=h;
}
function feedback(k,t){const o=document.createElement("div");o.className="overlay";const good=(i===11&&k==="B")||(i===16&&k==="C");o.innerHTML=`<div class="modal"><div class="eyebrow">FEEDBACK PÉDAGOGIQUE</div><h2>${good?"Bonne posture BA":"Point d’attention"}</h2><p style="font-size:19px;line-height:1.5">${t}</p><button class="btn primary" onclick="this.closest('.overlay').remove();next()">Continuer</button></div>`;document.body.appendChild(o)}
function facilitator(){const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal"><div class="eyebrow">MODE FORMATEUR</div><h2>Navigation directe</h2><p>Utilisez ce mode pour sauter à une séquence, mettre en pause et lancer une discussion en classe.</p>${scenes.map((s,j)=>`<button class="scene" onclick="i=${j};render();this.closest('.overlay').remove()">${j+1}. ${s.title}</button>`).join("")}<button class="btn secondary" onclick="this.closest('.overlay').remove()">Fermer</button></div>`;document.body.appendChild(o)}
function home(){progress();main.innerHTML=`<section class="stage"><div class="hero"><div class="hero-copy"><div class="eyebrow">VISUAL NOVEL PÉDAGOGIQUE · IIBA CAMEROUN</div><h1>ROSINE<span>Premier jour</span></h1><p class="lead">Une mission de Business Analysis chez Imhotep Assurance. Découvrez le problème avant d’apprendre comment le BABOK le structure.</p><p><button class="btn primary" onclick="next()">Commencer l’épisode</button> <button class="btn secondary" onclick="facilitator()">Mode formateur</button></p></div><div class="art"><div class="portrait"></div></div></div></section>`}
document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="f")facilitator();if(e.code==="Space"&&scenes[i]?.t!=="choice"){e.preventDefault();next()}});
home();
</script>
</body>
</html>
